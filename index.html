<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
      
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
      <meta http-equiv="Pragma" content="no-cache">
      <meta http-equiv="Expires" content="0">
      
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Lumio — AI Tutor</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    -webkit-tap-highlight-color: transparent;
}

:root {

    --bg: #080414;
    --bg2: #0e0620;

    --purple: #8b5cf6;
    --violet: #a855f7;
    --pink: #ec4899;

    --text: #f8f7ff;
    --muted: #aaa1c4;

    --border: rgba(196,181,253,.15);

}


/* =========================
   BODY
========================= */

body {

    height: 100vh;

    display: flex;
    flex-direction: column;

    color: var(--text);

    background:

        radial-gradient(
            circle at 15% 0%,
            rgba(139,92,246,.20),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 30%,
            rgba(236,72,153,.13),
            transparent 32%
        ),

        linear-gradient(
            180deg,
            #0c061d,
            #070310
        );

    overflow: hidden;
}


/* =========================
   HEADER
========================= */

.header {

    height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    background:
        rgba(10,5,25,.78);

    backdrop-filter: blur(20px);

    border-bottom:
        1px solid rgba(196,181,253,.10);

    font-size: 17px;
    font-weight: 700;

    z-index: 10;
}

.lumio-brand {
    display: flex;
    align-items: center;
    gap: 8px;

    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.6px;
}

.lumio-glow {
    color: #ffffff;

    text-shadow:
        0 0 15px rgba(168, 85, 247, 0.35);
}

.ai-badge {
    padding: 3px 8px;

    border-radius: 8px;

    font-size: 10px;
    font-weight: 800;

    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #ec4899
        );

    box-shadow:
        0 0 14px rgba(168, 85, 247, 0.35);
}

.header::after {

    content: "";

    position: absolute;

    bottom: -1px;

    left: 30%;
    right: 30%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a855f7,
            #ec4899,
            transparent
        );
}


/* =========================
   CHAT
========================= */

#chat-area {

    flex: 1;

    padding:
        18px 16px 20px;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 14px;

    scrollbar-width: thin;
    scrollbar-color:
        rgba(139,92,246,.35)
        transparent;
}


/* =========================
   ROBOT WELCOME
========================= */

.robot-welcome {

    display: flex;

    align-items: center;

    gap: 14px;

    margin-bottom: 3px;
}


.robot-container {

    position: relative;

    width: 72px;
    height: 72px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;
}


.robot-container::before {

    content: "";

    position: absolute;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(168,85,247,.35),
            rgba(236,72,153,.12),
            transparent 70%
        );

    filter: blur(8px);

    opacity: .8;

    transition:
        all .4s ease;
}


.robot {

    width: 70px;
    height: 70px;

    object-fit: contain;

    position: relative;

    z-index: 2;

    filter:
        drop-shadow(
            0 5px 15px
            rgba(168,85,247,.35)
        );

    transition:
        transform .4s ease,
        filter .4s ease;
}


/* =========================
   ROBOT NORMAL
========================= */

.robot.normal {

    animation:
        robotFloat 4s ease-in-out infinite;
}


@keyframes robotFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }

}


/* =========================
   ROBOT THINKING
========================= */

.robot.thinking {

    animation:
        robotThinking 1.5s ease-in-out infinite;

    filter:
        drop-shadow(
            0 0 14px
            rgba(168,85,247,.75)
        )
        drop-shadow(
            0 0 25px
            rgba(236,72,153,.35)
        );
}


@keyframes robotThinking {

    0% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }

    25% {
        transform:
            translateY(-5px)
            rotate(-4deg)
            scale(1.03);
    }

    50% {
        transform:
            translateY(0)
            rotate(3deg)
            scale(1);
    }

    75% {
        transform:
            translateY(-4px)
            rotate(-2deg)
            scale(1.03);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }

}


/* =========================
   THINKING GLOW
========================= */

.robot-container.thinking::before {

    animation:
        thinkingGlow 1.4s ease-in-out infinite;

}


@keyframes thinkingGlow {

    0%,100% {

        transform: scale(.8);

        opacity: .35;
    }

    50% {

        transform: scale(1.35);

        opacity: .9;
    }

}


/* =========================
   ANSWERING
========================= */

.robot.answering {

    animation:
        answerAnimation .65s ease;

}


@keyframes answerAnimation {

    0% {
        transform: scale(1);
    }

    45% {
        transform:
            scale(1.12)
            rotate(2deg);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   WELCOME TEXT
========================= */

.robot-text h2 {

    font-size: 17px;

    margin-bottom: 4px;
}


.robot-text p {

    font-size: 13px;

    color: var(--muted);
}


/* =========================
   MESSAGES
========================= */

.message {

    max-width: 86%;

    padding:
        14px 17px;

    border-radius: 20px;

    font-size: 15px;

    line-height: 1.55;

    animation:
        fadeIn .3s ease;

    word-wrap: break-word;
}


@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(8px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }

}


/* USER */

.user-msg {

    align-self: flex-end;

    background:

        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7 50%,
            #db2777
        );

    color: white;

    border-bottom-right-radius: 5px;

    box-shadow:
        0 6px 22px
        rgba(139,92,246,.28);
}


/* AI */

.ai-msg {

    align-self: flex-start;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.035)
        );

    color: #eeeafd;

    border:
        1px solid var(--border);

    border-bottom-left-radius: 5px;

    backdrop-filter:
        blur(14px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.18);
}


/* =========================
   SUBJECTS
========================= */

.subject-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 12px;
}


.subject-card {

    padding:
        13px 14px;

    border-radius: 15px;

    cursor: pointer;

    background:

        linear-gradient(
            145deg,
            rgba(139,92,246,.12),
            rgba(236,72,153,.05)
        );

    border:
        1px solid
        rgba(167,139,250,.20);

    color: #eeeaff;

    font-size: 14px;

    font-weight: 600;

    display: flex;

    align-items: center;

    gap: 8px;

    transition:
        all .15s ease;
}


.subject-card:hover {

    border-color:
        rgba(192,132,252,.55);

    background:

        linear-gradient(
            145deg,
            rgba(139,92,246,.22),
            rgba(236,72,153,.10)
        );

    transform:
        translateY(-1px);
}


.subject-card:active {

    transform:
        scale(.95);
}


/* =========================
   THINKING MESSAGE
========================= */

.thinking-message {

    display: flex;

    align-items: center;

    gap: 10px;
}


.thinking-small-robot {

    width: 30px;
    height: 30px;

    object-fit: contain;

    animation:
        miniRobot 1.3s
        ease-in-out infinite;

    filter:
        drop-shadow(
            0 0 7px
            rgba(168,85,247,.7)
        );
}


@keyframes miniRobot {

    0%,100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-3px)
            rotate(4deg);
    }
}


.thinking-text {

    color: #c4b5fd;

    font-size: 14px;
}


.thinking-dots {

    display: inline-flex;

    gap: 3px;

    margin-left: 3px;
}


.thinking-dots span {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        #c084fc;

    animation:
        dotPulse 1.2s
        infinite;
}


.thinking-dots span:nth-child(2) {
    animation-delay: .15s;
}

.thinking-dots span:nth-child(3) {
    animation-delay: .3s;
}


@keyframes dotPulse {

    0%,80%,100% {

        transform:
            translateY(0);

        opacity: .35;
    }

    40% {

        transform:
            translateY(-4px);

        opacity: 1;
    }

}


/* =========================
   INPUT
========================= */

.input-area {

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        11px 13px;

    background:
        rgba(8,4,20,.88);

    backdrop-filter:
        blur(20px);

    border-top:
        1px solid
        rgba(196,181,253,.10);
}


#user-input {

    flex: 1;

    height: 46px;

    padding:
        0 18px;

    border:
        1px solid
        rgba(196,181,253,.18);

    border-radius: 25px;

    outline: none;

    color: white;

    background:
        rgba(255,255,255,.055);

    font-size: 15px;

    transition:
        all .2s ease;
}


#user-input::placeholder {

    color:
        #8f88a8;
}


#user-input:focus {

    border-color:
        rgba(168,85,247,.65);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.10);
}


/* =========================
   SEND BUTTON
========================= */

#send-btn {

    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    background:

        linear-gradient(
            135deg,
            #7c3aed,
            #a855f7 50%,
            #ec4899
        );

    box-shadow:
        0 5px 18px
        rgba(139,92,246,.35);

    transition:
        all .15s ease;

    flex-shrink: 0;
}


#send-btn:hover {

    transform:
        translateY(-1px);

    box-shadow:
        0 7px 24px
        rgba(168,85,247,.48);
}


#send-btn:active {

    transform:
        scale(.91);
}


#send-btn:disabled {

    background:
        #383246;

    opacity: .7;

    box-shadow: none;

    cursor:
        not-allowed;
}


#send-btn svg {

    width: 20px;
    height: 20px;

    fill: white;

    margin-left: 2px;
}


/* =========================
   MOBILE
========================= */

@media (max-width:480px) {

    .header {
        height: 58px;
        font-size: 16px;
    }

    #chat-area {
        padding:
            16px 12px;
    }

    .message {
        max-width: 90%;
        font-size: 14.5px;
    }

    .robot-container {
        width: 62px;
        height: 62px;
    }

    .robot {
        width: 62px;
        height: 62px;
    }

    .subject-card {
        font-size: 13px;
        padding: 12px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="lumio-brand">
        <span class="lumio-glow">Lumio</span>
        <span class="ai-badge">AI</span>
    </div>

</div>


<!-- =========================
     CHAT
========================= -->

<div id="chat-area">


    <!-- WELCOME -->

    <div class="message ai-msg">

        <div class="robot-welcome">

            <div
                class="robot-container"
                id="main-robot-container"
            >

                <img
                    src="lumio-robot.png"
                    class="robot normal"
                    id="main-robot"
                    alt="Lumio AI"
                >

            </div>


            <div class="robot-text">

                <h2>
                    Привет! Я Lumio 🤖
                </h2>

                <p>
                    Твой AI-помощник в обучении
                </p>

            </div>

        </div>


        <div style="margin-top:10px;color:#b9b2d0;">

            Выбери предмет или напиши свой вопрос:

        </div>


        <div class="subject-grid">


            <div
                class="subject-card"
                onclick="sendSubject(
                    'Объясни тему по Математике для ОРТ'
                )"
            >

                <span>📐</span>

                Математика

            </div>


            <div
                class="subject-card"
                onclick="sendSubject(
                    'Как решать раздел Аналогии в ОРТ?'
                )"
            >

                <span>🔗</span>

                Аналогии

            </div>


            <div
                class="subject-card"
                onclick="sendSubject(
                    'Дай советы по разделу Чтение и понимание'
                )"
            >

                <span>📖</span>

                Чтение

            </div>


            <div
                class="subject-card"
                onclick="sendSubject(
                    'Объясни правила Практической грамматики'
                )"
            >

                <span>✍️</span>

                Грамматика

            </div>


        </div>

    </div>


</div>


<!-- =========================
     INPUT
========================= -->

<div class="input-area">


    <input
        type="text"
        id="user-input"
        placeholder="Спросить у Lumio..."
        onkeydown="
            if(event.key === 'Enter')
                sendMessage()
        "
    >


    <button
        id="send-btn"
        onclick="sendMessage()"
    >

        <svg viewBox="0 0 24 24">

            <path
                d="
                M2.01 21L23 12
                2.01 3 2 10
                l15 2-15 2z
                "
            ></path>

        </svg>

    </button>


</div>


<script>


/* =========================
   ELEMENTS
========================= */

const robot =
    document.getElementById(
        "main-robot"
    );

const robotContainer =
    document.getElementById(
        "main-robot-container"
    );


/* =========================
   ROBOT STATES
========================= */

function setRobotState(state) {

    robot.classList.remove(
        "normal",
        "thinking",
        "answering"
    );

    robotContainer.classList.remove(
        "thinking"
    );


    if(state === "thinking") {

        robot.classList.add(
            "thinking"
        );

        robotContainer.classList.add(
            "thinking"
        );

    }


    else if(state === "answering") {

        robot.classList.add(
            "answering"
        );

    }


    else {

        robot.classList.add(
            "normal"
        );

    }

}


/* =========================
   SEND SUBJECT
========================= */

function sendSubject(text) {

    sendMessage(text);

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(presetText) {


    const input =
        document.getElementById(
            "user-input"
        );


    const btn =
        document.getElementById(
            "send-btn"
        );


    const chatArea =
        document.getElementById(
            "chat-area"
        );


    const msgText =
        presetText ||
        input.value.trim();


    if(!msgText) return;


    /* =====================
       USER MESSAGE
    ===================== */

    const userBubble =
        document.createElement(
            "div"
        );


    userBubble.className =
        "message user-msg";


    userBubble.textContent =
        msgText;


    chatArea.appendChild(
        userBubble
    );


    if(!presetText) {

        input.value = "";

    }


    /* =====================
       ROBOT THINKING
    ===================== */

    setRobotState(
        "thinking"
    );


    /* =====================
       THINKING BUBBLE
    ===================== */

    const loadingBubble =
        document.createElement(
            "div"
        );


    loadingBubble.className =
        "message ai-msg";


    loadingBubble.id =
        "loading-indicator";


    loadingBubble.innerHTML = `

        <div class="thinking-message">

            <img
                src="lumio-robot.png"
                class="thinking-small-robot"
            >

            <span class="thinking-text">

                Lumio думает

                <span class="thinking-dots">

                    <span></span>
                    <span></span>
                    <span></span>

                </span>

            </span>

        </div>

    `;


    chatArea.appendChild(
        loadingBubble
    );


    chatArea.scrollTop =
        chatArea.scrollHeight;


    btn.disabled = true;


    /* =====================
       API
    ===================== */

    try {


        const response =
            await fetch(
                "https://ort-ai-backend.onrender.com/api/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                msgText
                        })

                }
            );


        /* REMOVE LOADER */

        const loader =
            document.getElementById(
                "loading-indicator"
            );


        if(loader) {

            loader.remove();

        }


        if(!response.ok) {

            throw new Error(
                "Ошибка сервера: " +
                response.status
            );

        }


        const data =
            await response.json();


        /* =====================
           ANSWERING
        ===================== */

        setRobotState(
            "answering"
        );


        /* =====================
           AI MESSAGE
        ===================== */

        const aiBubble =
            document.createElement(
                "div"
            );


        aiBubble.className =
            "message ai-msg";


        aiBubble.textContent =
            data.reply ||
            "Получен пустой ответ.";


        chatArea.appendChild(
            aiBubble
        );


        chatArea.scrollTop =
            chatArea.scrollHeight;


        /* RETURN TO NORMAL */

        setTimeout(
            () => {

                setRobotState(
                    "normal"
                );

            },
            700
        );


    }


    catch(err) {


        console.error(
            "Ошибка:",
            err
        );


        const loader =
            document.getElementById(
                "loading-indicator"
            );


        if(loader) {

            loader.remove();

        }


        const errBubble =
            document.createElement(
                "div"
            );


        errBubble.className =
            "message ai-msg";


        errBubble.textContent =
            "Ошибка соединения с сервером. " +
            "Попробуйте еще раз.";


        chatArea.appendChild(
            errBubble
        );


        setRobotState(
            "normal"
        );

    }


    finally {

        btn.disabled =
            false;

        chatArea.scrollTop =
            chatArea.scrollHeight;

    }

}

</script>


</body>
</html>
