<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumio AI — Персональный помощник</title>
    <!-- Подключаем CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Вход / Регистрация -->
    <div class="auth-card" id="authScreen">
        <h2 id="formTitle">Lumio — Вход</h2>
        <input type="text" id="username" placeholder="Логин (Email)">
        <input type="password" id="password" placeholder="Пароль">

        <button class="main-btn" id="mainBtn" onclick="handleAuth()">Войти</button>
        <div id="statusMsg" class="status-msg"></div>
        <button class="switch-btn" id="switchBtn" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</button>
    </div>

    <!-- Основное приложение (изначально скрыто) -->
    <div class="app-container" id="appScreen" style="display: none;">
        
        <!-- Шапка с логотипом и выпадающим списком ролей -->
        <div class="navbar">
            <div class="logo-group">
                <span class="brand-title">Lumio</span>
                <span class="logo-badge">AI</span>
            </div>
            <div class="role-selector-container">
                <select id="roleSelect" class="role-selector">
                    <option value="student">🎓 Ученик (ОРТ / Экзамены)</option>
                    <option value="teacher">👨‍🏫 Учитель (Планы / Рейтинг)</option>
                    <option value="language">🗣 Изучение языков</option>
                </select>
            </div>
        </div>

        <!-- Переключатель языка интерфейса -->
        <div class="lang-switcher">
            <button onclick="setLanguage('ru')" id="langRuBtn" class="active-lang">Русский</button>
            <button onclick="setLanguage('kg')" id="langKgBtn">Кыргызча</button>
        </div>

        <!-- Динамический контент (меняется в зависимости от выбранной роли) -->
        <div id="dynamicContentContainer">
            <!-- Сюда JavaScript автоматически подгружает заголовок, подзаголовок и карточки -->
        </div>

        <!-- История чата -->
        <div class="chat-history" id="chatHistory"></div>

        <!-- Поле ввода -->
        <div class="chat-input-box">
            <input type="text" id="userInput" placeholder="Задай вопрос..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">→</button>
        </div>

    </div>

    <!-- Подключаем JavaScript -->
    <script src="script.js"></script>
</body>
</html>
