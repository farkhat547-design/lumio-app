<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMIO — AI Tutor</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f0c1b">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f0c1b; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #1a162b; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #332d4d; }
    .logo-container { display: flex; align-items: center; gap: 10px; }
    .logo-container img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .logo-container h1 { font-size: 18px; font-weight: bold; background: linear-gradient(135deg, #a78bfa, #7c4dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .user-msg { background: #7c4dff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot-msg { background: #1a162b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #332d4d; }
    
    .input-area { background: #1a162b; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #332d4d; }
    .input-area input { flex: 1; background: #0f0c1b; border: 1px solid #332d4d; padding: 12px 16px; border-radius: 24px; color: #fff; font-size: 15px; outline: none; }
    .input-area button { background: #7c4dff; border: none; width: 44px; height: 44px; border-radius: 50%; color: #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</head>
<body>

  <div id="auth-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 12, 27, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; color: white;">
    <div style="background: #1a162b; padding: 25px; border-radius: 16px; border: 1px solid #332d4d; width: 90%; max-width: 360px; text-align: center;">
      <img src="logo.png" style="width: 70px; height: 70px; margin-bottom: 10px; border-radius: 50%; object-fit: cover;">
      <h2 id="auth-title" style="margin-bottom: 5px; font-size: 20px;">Вход в LUMIO</h2>
      <p style="color: #a099c0; font-size: 13px; margin-bottom: 20px;">Подготовка к ОРТ с ИИ</p>
      
      <input type="email" id="auth-email" placeholder="Ваш Email" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #332d4d; background: #0f0c1b; color: white; box-sizing: border-box; outline: none;">
      <input type="password" id="auth-pass" placeholder="Пароль" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #332d4d; background: #0f0c1b; color: white; box-sizing: border-box; outline: none;">
      
      <button id="auth-submit-btn" onclick="handleAuthSubmit()" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: #7c4dff; color: white; font-weight: bold; cursor: pointer; margin-bottom: 12px;">Войти</button>
      
      <p style="font-size: 13px; color: #a099c0; cursor: pointer;" onclick="toggleAuthMode()">
        <span id="auth-toggle-text">Нет аккаунта? Зарегистрироваться</span>
      </p>
    </div>
  </div>

  <header>
    <div class="logo-container">
      <img src="logo.png" alt="LUMIO Logo">
      <h1>LUMIO</h1>
    </div>
    <button onclick="window.lumioAuth.signOut(window.lumioAuth.auth)" style="background: none; border: 1px solid #332d4d; color: #a099c0; padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 12px;">Выйти</button>
  </header>

  <div id="chat-container">
    <div class="message bot-msg">Привет! Я LUMIO, твой ИИ-репетитор по подготовке к ОРТ. Чем помочь сегодня?</div>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Задай вопрос по ОРТ..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➔</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
       apiKey: "AIzaSyB0OeWZYnucEsKmWyROF0ApRu7KwosYJuE",
       authDomain: "lumio-app-c2d26.firebaseapp.com",
       projectId: "lumio-app-c2d26",
       storageBucket: "lumio-app-c2d26.firebasestorage.app",
       messagingSenderId: "1094376054556",
       appId: "1:1094376054556:web:df88379a3e96331c6fa4d9",
       measurementId: "G-HMCSX7HH5B"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.lumioAuth = { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, doc, setDoc, getDoc };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-modal').style.display = 'none';
      } else {
        document.getElementById('auth-modal').style.display = 'flex';
      }
    });

    let isSignUpMode = false;
    window.toggleAuthMode = () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').innerText = isSignUpMode ? 'Регистрация в LUMIO' : 'Вход в LUMIO';
      document.getElementById('auth-submit-btn').innerText = isSignUpMode ? 'Создать аккаунт' : 'Войти';
      document.getElementById('auth-toggle-text').innerText = isSignUpMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    };

    window.handleAuthSubmit = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      if(!email || !pass) { alert("Введите Email и пароль!"); return; }
      try {
        if (isSignUpMode) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (error) {
        alert("Ошибка: " + error.message);
      }
    };
  </script>

  <script>
    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if(!text) return;

      const chat = document.getElementById('chat-container');
      
      const userMsg = document.createElement('div');
      userMsg.className = 'message user-msg';
      userMsg.innerText = text;
      chat.appendChild(userMsg);
      
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'message bot-msg';
        botMsg.innerText = "Отличный вопрос! Я готовый помочь тебе разобраться с этой темой ОРТ.";
        chat.appendChild(botMsg);
        chat.scrollTop = chat.scrollHeight;
      }, 600);
    }
  </script>
</body>
</html>
