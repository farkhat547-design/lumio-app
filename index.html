<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUMIO ОРТ AI Репетитор</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #111827;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            padding: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
            z-index: 10;
        }

        #chat-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 3px 10px rgba(79, 70, 229, 0.25);
        }

        .ai-msg {
            align-self: flex-start;
            background: #ffffff;
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }

        .welcome-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .subject-card {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
            user-select: none;
        }

        .subject-card:hover {
            border-color: #6366f1;
            background: #eef2ff;
        }

        .subject-card:active {
            transform: scale(0.95);
            background: #e0e7ff;
        }

        /* Индикатор загрузки */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            display: flex;
            padding: 12px 16px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 12px 18px;
            border: 1.5px solid #cbd5e1;
            border-radius: 24px;
            outline: none;
            font-size: 15px;
            background: #f8fafc;
        }

        #user-input:focus {
            border-color: #4f46e5;
            background: #ffffff;
        }

        #send-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3);
            flex-shrink: 0;
        }

        #send-btn:active {
            transform: scale(0.92);
        }

        #send-btn:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        #send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
            margin-left: 2px;
        }
    </style>
</head>
<body>

    <div class="header">🎓LUMIO ОРТ AI Репетитор</div>

    <div id="chat-area">
        <div class="message ai-msg">
            <div class="welcome-card">
                <div><b>Привет! 👋 Я твой ИИ-репетитор по ОРТ LUMIO.</b></div>
                <div>Выбери предмет ниже или напиши свой вопрос:</div>
                
                <div class="subject-grid">
                    <div class="subject-card" onclick="sendSubject('Объясни тему по Математике для ОРТ')">
                        <span>📐</span> Математика
                    </div>
                    <div class="subject-card" onclick="sendSubject('Как решать раздел Аналогии в ОРТ?')">
                        <span>🔗</span> Аналогии
                    </div>
                    <div class="subject-card" onclick="sendSubject('Дай советы по разделу Чтение и понимание')">
                        <span>📖</span> Чтение
                    </div>
                    <div class="subject-card" onclick="sendSubject('Объясни правила Практической грамматики')">
                        <span>✍️</span> Грамматика
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Спросить у ИИ..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>

    <script>
        function sendSubject(text) {
            sendMessage(text);
        }

        async function sendMessage(presetText) {
            const input = document.getElementById('user-input');
            const btn = document.getElementById('send-btn');
            const chatArea = document.getElementById('chat-area');

            const msgText = presetText || input.value.trim();
            if (!msgText) return;

            // 1. Сообщение пользователя
            const userBubble = document.createElement('div');
            userBubble.className = 'message user-msg';
            userBubble.textContent = msgText;
            chatArea.appendChild(userBubble);

            if (!presetText) input.value = '';

            // 2. Индикатор "ИИ думает..."
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'message ai-msg';
            loadingBubble.id = 'loading-indicator';
            loadingBubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
            chatArea.appendChild(loadingBubble);

            chatArea.scrollTop = chatArea.scrollHeight;
            btn.disabled = true;

            try {
                const response = await fetch('https://ort-ai-backend.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msgText })
                });

                // Удаляем индикатор загрузки
                const loader = document.getElementById('loading-indicator');
                if (loader) loader.remove();

                if (!response.ok) {
                    throw new Error('Ошибка сервера: ' + response.status);
                }

                const data = await response.json();

                // 3. Ответ ИИ
                const aiBubble = document.createElement('div');
                aiBubble.className = 'message ai-msg';
                aiBubble.textContent = data.reply || 'Получен пустой ответ.';
                chatArea.appendChild(aiBubble);
            } catch (err) {
                console.error('Ошибка:', err);
                const loader = document.getElementById('loading-indicator');
                if (loader) loader.remove();

                const errBubble = document.createElement('div');
                errBubble.className = 'message ai-msg';
                errBubble.textContent = 'Ошибка соединения с сервером. Попробуйте еще раз.';
                chatArea.appendChild(errBubble);
            } finally {
                btn.disabled = false;
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }
    </script>
</body>
</html>
