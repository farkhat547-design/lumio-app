<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMIO — ИИ-репетитор ОРТ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-card {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: #1e1e24;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            padding: 20px;
            background: #282832;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #383846;
        }

        .header h2 {
            font-size: 1.2rem;
            color: #a5b4fc;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #6366f1;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            background-color: #2a2a36;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            white-space: pre-wrap;
        }

        .input-area {
            padding: 15px;
            background: #282832;
            display: flex;
            gap: 10px;
            border-top: 1px solid #383846;
        }

        input {
            flex: 1;
            background: #121214;
            border: 1px solid #383846;
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="header">
            <h2>LUMIO</h2>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="message bot-msg">Привет! Я LUMIO, твой ИИ-репетитор по подготовке к ОРТ. Чем помочь сегодня?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Задай вопрос по ОРТ..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">→</button>
        </div>
    </div>

    <script>
        // Ваш зашифрованный API ключ
        const encodedKey = "QVEuQWI4Uk42STU2QXBsOTc1MlFic2NQZ1ZPMWdDVllPcDdNYzhub3NPZC1kaHZKYVVmMmc="; 
        const GEMINI_API_KEY = atob(encodedKey).trim();

        // Список моделей для подстраховки
        const modelsToTry = [
            'gemini-3.8-flash',
            'gemini-3.1-pro-preview',
            'gemini-2.0-flash'
        ];

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-container');

            if (!input || !chat) return;

            const text = input.value.trim();
            if (!text) return;

            // Выводим сообщение пользователя
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-msg';
            userMsg.innerText = text;
            chat.appendChild(userMsg);

            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Индикатор загрузки
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot-msg';
            botMsg.innerText = "Думаю...";
            chat.appendChild(botMsg);
            chat.scrollTop = chat.scrollHeight;

            let success = false;

            for (const model of modelsToTry) {
                try {
                    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + GEMINI_API_KEY;

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                role: "user",
                                parts: [{ text: "Ты — LUMIO, ИИ-репетитор по подготовке к ОРТ в Кыргызстане. Отвечай кратко, понятными словами и только по-русски. Вопрос: " + text }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        botMsg.innerText = reply || "Пустой ответ от ИИ.";
                        chat.scrollTop = chat.scrollHeight;
                        success = true;
                        break;
                    }
                } catch (err) {
                    console.error("Ошибка при запросе:", err);
                }
            }

            if (!success) {
                botMsg.innerText = "Серверы сейчас перегружены. Попробуйте отправить сообщение ещё раз.";
            }
        }
    </script>
</body>
</html>
