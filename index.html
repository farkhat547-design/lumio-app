<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumio AI — Персональный помощник</title>
    <!-- Подключаем CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Вход / Регистрация -->
    <div class="auth-card" id="authScreen">
        <h2 id="formTitle">Lumio — Вход</h2>
        <input type="text" id="username" placeholder="Логин (Email)">
        <input type="password" id="password" placeholder="Пароль">

        <button class="main-btn" id="mainBtn" onclick="handleAuth()">Войти</button>
        <div id="statusMsg" class="status-msg"></div>
        <button class="switch-btn" id="switchBtn" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</button>
    </div>

    <!-- Основное приложение (изначально скрыто) -->
    <div class="app-container" id="appScreen" style="display: none;">
        
        <!-- Шапка с логотипом и переключателем ролей -->
        <div class="navbar">
            <div class="logo-group">
                <span class="brand-title">Lumio</span>
                <span class="logo-badge">AI</span>
            </div>
            <div class="role-selector-container">
                <select id="roleSelect" class="role-selector">
                    <option value="student">🎓 Ученик (ОРТ / Экзамены)</option>
                    <option value="teacher">👨‍🏫 Учитель (Планы / Тесты)</option>
                    <option value="language">🗣 Изучение языка</option>
                </select>
            </div>
        </div>

        <!-- Приветственный блок -->
        <div class="hero-section" id="heroSection">
            <h1>Привет! Я Lumio</h1>
            <p>Твой персональный AI-помощник в обучении.</p>
            <span class="hero-sub">С чего начнём?</span>
        </div>

        <!-- Переключатель языка интерфейса -->
        <div class="lang-switcher">
            <button onclick="setLanguage('ru')" id="langRuBtn" class="active-lang">Русский</button>
            <button onclick="setLanguage('kg')" id="langKgBtn">Кыргызча</button>
        </div>

        <!-- Кнопки предметных карточек -->
        <div class="cards-grid" id="cardsGrid">
            <div class="subject-card" onclick="selectSubject('Математика')">
                <div class="card-icon">Σ</div>
                <div class="card-title">Математика</div>
                <div class="card-desc">Решение задач и объяснение тем</div>
            </div>
            <div class="subject-card" onclick="selectSubject('Аналогии')">
                <div class="card-icon">◇</div>
                <div class="card-title">Аналогии</div>
                <div class="card-desc">Логика и поиск связей</div>
            </div>
            <div class="subject-card" onclick="selectSubject('Чтение')">
                <div class="card-icon">◎</div>
                <div class="card-title">Чтение</div>
                <div class="card-desc">Тексты и понимание смысла</div>
            </div>
            <div class="subject-card" onclick="selectSubject('Грамматика')">
                <div class="card-icon">Aa</div>
                <div class="card-title">Грамматика</div>
                <div class="card-desc">Правила и практика</div>
            </div>
        </div>

        <!-- История чата -->
        <div class="chat-history" id="chatHistory"></div>

        <!-- Поле ввода -->
        <div class="chat-input-box">
            <input type="text" id="userInput" placeholder="Задай вопрос по ОРТ..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">→</button>
        </div>

    </div>

    <!-- Подключаем JavaScript -->
    <script src="script.js"></script>
</body>
</html>
