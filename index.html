<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Lumio — AI Education</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-main: #09051a;
            --bg-secondary: #100827;
            --purple: #8b5cf6;
            --violet: #a855f7;
            --pink: #ec4899;
            --light-purple: #c4b5fd;
            --text-main: #f8f7ff;
            --text-secondary: #b9b2d0;
            --card: rgba(255, 255, 255, 0.055);
            --border: rgba(196, 181, 253, 0.16);
        }

        body {
            background:
                radial-gradient(circle at 20% 0%, rgba(139, 92, 246, 0.20), transparent 35%),
                radial-gradient(circle at 90% 30%, rgba(236, 72, 153, 0.12), transparent 30%),
                linear-gradient(180deg, #0b061c 0%, #080414 100%);

            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: relative;
            background: rgba(12, 7, 30, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            padding: 17px 16px;
            text-align: center;

            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.2px;

            color: #ffffff;

            border-bottom: 1px solid rgba(196, 181, 253, 0.12);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.25);

            z-index: 10;
        }

        .header::after {
            content: "";
            position: absolute;
            left: 25%;
            right: 25%;
            bottom: -1px;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                #a855f7,
                #ec4899,
                transparent
            );

            opacity: 0.8;
        }

        /* =========================
           CHAT
        ========================= */

        #chat-area {
            flex: 1;
            padding: 20px 16px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;
            gap: 14px;

            scrollbar-width: thin;
            scrollbar-color: rgba(139, 92, 246, 0.4) transparent;
        }

        #chat-area::-webkit-scrollbar {
            width: 5px;
        }

        #chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-area::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.35);
            border-radius: 10px;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            max-width: 86%;

            padding: 14px 17px;

            border-radius: 20px;

            font-size: 15px;
            line-height: 1.55;

            animation: fadeIn 0.3s ease;

            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           USER MESSAGE
        ========================= */

        .user-msg {
            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed 0%,
                    #9333ea 48%,
                    #db2777 100%
                );

            color: #ffffff;

            border-bottom-right-radius: 5px;

            box-shadow:
                0 6px 22px rgba(139, 92, 246, 0.28);

            border: 1px solid rgba(255, 255, 255, 0.10);
        }

        /* =========================
           AI MESSAGE
        ========================= */

        .ai-msg {
            align-self: flex-start;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.035)
                );

            color: #eeeafd;

            border-bottom-left-radius: 5px;

            border: 1px solid var(--border);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.18);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .welcome-card b {
            color: #ffffff;
            font-size: 15.5px;
        }

        .welcome-card > div:nth-child(2) {
            color: var(--text-secondary);
        }

        /* =========================
           SUBJECT CARDS
        ========================= */

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 8px;
        }

        .subject-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(139, 92, 246, 0.11),
                    rgba(236, 72, 153, 0.045)
                );

            border: 1px solid rgba(167, 139, 250, 0.20);

            padding: 13px 14px;

            border-radius: 15px;

            font-size: 14px;
            font-weight: 600;

            color: #eeeaff;

            cursor: pointer;

            display: flex;
            align-items: center;

            gap: 8px;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;

            user-select: none;

            overflow: hidden;
        }

        .subject-card::before {
            content: "";

            position: absolute;

            width: 60px;
            height: 60px;

            background: rgba(168, 85, 247, 0.14);

            filter: blur(20px);

            border-radius: 50%;

            top: -30px;
            right: -20px;
        }

        .subject-card:hover {
            border-color: rgba(192, 132, 252, 0.55);

            background:
                linear-gradient(
                    145deg,
                    rgba(139, 92, 246, 0.20),
                    rgba(236, 72, 153, 0.10)
                );

            box-shadow:
                0 5px 20px rgba(139, 92, 246, 0.15);

            transform: translateY(-1px);
        }

        .subject-card:active {
            transform: scale(0.96);

            background:
                linear-gradient(
                    145deg,
                    rgba(139, 92, 246, 0.25),
                    rgba(236, 72, 153, 0.15)
                );
        }

        .subject-card span {
            font-size: 18px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading-dots {
            display: inline-flex;

            gap: 5px;

            align-items: center;
        }

        .loading-dots span {
            width: 7px;
            height: 7px;

            background: linear-gradient(
                135deg,
                #a855f7,
                #ec4899
            );

            border-radius: 50%;

            animation:
                pulse 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes pulse {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* =========================
           INPUT AREA
        ========================= */

        .input-area {
            display: flex;

            padding: 12px 14px;

            background:
                rgba(9, 5, 26, 0.88);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-top:
                1px solid rgba(196, 181, 253, 0.10);

            gap: 10px;

            align-items: center;

            box-shadow:
                0 -8px 30px rgba(0, 0, 0, 0.18);
        }

        /* =========================
           INPUT
        ========================= */

        #user-input {
            flex: 1;

            padding: 13px 18px;

            border:
                1px solid rgba(196, 181, 253, 0.18);

            border-radius: 25px;

            outline: none;

            font-size: 15px;

            color: #f8f7ff;

            background:
                rgba(255, 255, 255, 0.055);

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        #user-input::placeholder {
            color: #8f88a8;
        }

        #user-input:focus {
            border-color: rgba(168, 85, 247, 0.65);

            background:
                rgba(255, 255, 255, 0.075);

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.10);
        }

        /* =========================
           SEND BUTTON
        ========================= */

        #send-btn {
            position: relative;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7 50%,
                    #ec4899
                );

            color: white;

            border: none;

            width: 46px;
            height: 46px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(139, 92, 246, 0.35);

            flex-shrink: 0;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        #send-btn:hover {
            box-shadow:
                0 7px 24px rgba(168, 85, 247, 0.48);

            transform: translateY(-1px);
        }

        #send-btn:active {
            transform: scale(0.91);
        }

        #send-btn:disabled {
            background: #383246;

            box-shadow: none;

            cursor: not-allowed;

            opacity: 0.7;
        }

        #send-btn svg {
            width: 20px;
            height: 20px;

            fill: white;

            margin-left: 2px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .header {
                font-size: 17px;
                padding: 15px;
            }

            #chat-area {
                padding: 16px 12px;
            }

            .message {
                max-width: 90%;
                font-size: 14.5px;
            }

            .subject-card {
                padding: 12px;
                font-size: 13px;
            }

            .input-area {
                padding: 10px 11px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        ✦ LUMIO AI Tutor
    </div>

    <div id="chat-area">

        <div class="message ai-msg">

            <div class="welcome-card">

                <div>
                    <b>Привет! 👋 Я твой AI-репетитор Lumio.</b>
                </div>

                <div>
                    Выбери предмет или напиши свой вопрос:
                </div>

                <div class="subject-grid">

                    <div
                        class="subject-card"
                        onclick="sendSubject('Объясни тему по Математике для ОРТ')"
                    >
                        <span>📐</span>
                        Математика
                    </div>

                    <div
                        class="subject-card"
                        onclick="sendSubject('Как решать раздел Аналогии в ОРТ?')"
                    >
                        <span>🔗</span>
                        Аналогии
                    </div>

                    <div
                        class="subject-card"
                        onclick="sendSubject('Дай советы по разделу Чтение и понимание')"
                    >
                        <span>📖</span>
                        Чтение
                    </div>

                    <div
                        class="subject-card"
                        onclick="sendSubject('Объясни правила Практической грамматики')"
                    >
                        <span>✍️</span>
                        Грамматика
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Спросить у Lumio..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button
            id="send-btn"
            onclick="sendMessage()"
        >

            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>

        </button>

    </div>

    <script>

        function sendSubject(text) {
            sendMessage(text);
        }

        async function sendMessage(presetText) {

            const input = document.getElementById('user-input');
            const btn = document.getElementById('send-btn');
            const chatArea = document.getElementById('chat-area');

            const msgText = presetText || input.value.trim();

            if (!msgText) return;

            /* USER MESSAGE */

            const userBubble = document.createElement('div');

            userBubble.className = 'message user-msg';

            userBubble.textContent = msgText;

            chatArea.appendChild(userBubble);

            if (!presetText) {
                input.value = '';
            }

            /* LOADING */

            const loadingBubble = document.createElement('div');

            loadingBubble.className = 'message ai-msg';

            loadingBubble.id = 'loading-indicator';

            loadingBubble.innerHTML = `
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;

            chatArea.appendChild(loadingBubble);

            chatArea.scrollTop = chatArea.scrollHeight;

            btn.disabled = true;

            try {

                const response = await fetch(
                    'https://ort-ai-backend.onrender.com/api/chat',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            message: msgText
                        })
                    }
                );

                const loader =
                    document.getElementById('loading-indicator');

                if (loader) loader.remove();

                if (!response.ok) {
                    throw new Error(
                        'Ошибка сервера: ' + response.status
                    );
                }

                const data = await response.json();

                /* AI RESPONSE */

                const aiBubble =
                    document.createElement('div');

                aiBubble.className = 'message ai-msg';

                aiBubble.textContent =
                    data.reply || 'Получен пустой ответ.';

                chatArea.appendChild(aiBubble);

            } catch (err) {

                console.error('Ошибка:', err);

                const loader =
                    document.getElementById('loading-indicator');

                if (loader) loader.remove();

                const errBubble =
                    document.createElement('div');

                errBubble.className = 'message ai-msg';

                errBubble.textContent =
                    'Ошибка соединения с сервером. Попробуйте еще раз.';

                chatArea.appendChild(errBubble);

            } finally {

                btn.disabled = false;

                chatArea.scrollTop =
                    chatArea.scrollHeight;
            }
        }

    </script>

</body>
</html>
